name = "taiwanesemeetingassistant"
main = "worker.js"
compatibility_date = "2026-01-01"

# KV namespace（已建立）：
#   npx wrangler kv namespace create MEETSUM_KV
[[kv_namespaces]]
binding = "MEETSUM_KV"
id = "603ac88cf6f4446b8b4ceb46de753c4c"

# 自訂網域（可選）：把 Worker 掛在 discover.<你的網域>
# routes = [
#   { pattern = "discover.example.com/*", custom_domain = true }
# ]

# Secrets（不要寫在檔案裡）：
#   npx wrangler secret put PUSH_TOKEN
