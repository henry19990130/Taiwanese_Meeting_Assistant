name: Convert Breeze-ASR-26 to WhisperKit Core ML

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: 'Model version to convert'
        required: true
        default: 'MediaTek-Research/Breeze-ASR-26'
        type: choice
        options:
          - MediaTek-Research/Breeze-ASR-26
          - MediaTek-Research/Breeze-ASR-25
      quantize:
        description: 'Quantization level'
        required: true
        default: '4bit'
        type: choice
        options:
          - none
          - 4bit
          - 8bit
      hf_repo:
        description: 'Hugging Face repo to upload to (e.g., username/breeze-asr-26-whisperkit)'
        required: false
        default: ''
        type: string
      hf_private:
        description: 'Make HF repo private'
        required: false
        default: false
        type: boolean
      run_ios_test:
        description: 'Also compile the iOS app (slower, needs npm install)'
        required: false
        default: false
        type: boolean

jobs:
  convert:
    name: Convert to Core ML
    runs-on: macos-latest
    # 4-bit 全模型 palettize（encoder 320 + decoder 194 個 module）約 60-100 分鐘
    timeout-minutes: 300
    permissions:
      contents: write
    outputs:
      model_slug: ${{ steps.vars.outputs.model_slug }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # WhisperKitTools 對版本很敏感；照 setup.py 的 pin 安裝
          pip install "torch==2.5.0" "transformers==4.53" "numpy<2.4.0" coremltools huggingface_hub
          pip install git+https://github.com/argmaxinc/WhisperKitTools.git

      # 先確認 HF_TOKEN 屬於預期的帳號，避免模型默默上傳到別的帳號。
      - name: Verify Hugging Face account
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXPECTED_HF_USER: CHCBEN
        run: |
          python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "").strip()
          if not token:
              sys.exit("::error::HF_TOKEN 未設定")
          whoami = HfApi(token=token).whoami()
          name = whoami.get("name") or ""
          print(f"HF account: {name}")
          if name != os.environ["EXPECTED_HF_USER"]:
              sys.exit(f"::error::HF_TOKEN 屬於 {name}，預期 {os.environ['EXPECTED_HF_USER']}")
          PY

      - name: Set model version slug
        id: vars
        run: |
          slug="$(echo '${{ github.event.inputs.model_version }}' | sed 's|/|-|g')"
          echo "model_slug=${slug}" >> "$GITHUB_OUTPUT"

      - name: Convert model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/convert_breeze_asr_26.py \
            --model-version "${{ github.event.inputs.model_version }}" \
            --output-dir ./breeze-asr-coreml \
            --quantize "${{ github.event.inputs.quantize }}"

      - name: Verify output
        run: |
          python scripts/convert_breeze_asr_26.py --verify-only --output-dir ./breeze-asr-coreml

      - name: Upload to Hugging Face Hub
        if: github.event.inputs.hf_repo != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          extra=""
          if [ "${{ github.event.inputs.hf_private }}" = "true" ]; then extra="--hf-private"; fi
          python scripts/convert_breeze_asr_26.py \
            --verify-only \
            --output-dir ./breeze-asr-coreml \
            --hf-repo "${{ github.event.inputs.hf_repo }}" \
            --hf-token "${HF_TOKEN}" \
            --quantized-only \
            $extra

      - name: Create release archives
        run: |
          cd breeze-asr-coreml
          count=0
          for dir in */; do
            name="${dir%/}"
            [ -f "$name/config.json" ] || continue
            # 只打包量化 variant（_<N>MB），全精度資料夾太大且 App 用不到
            case "$name" in *_*MB) ;; *) continue ;; esac
            zip -q -r "../${name}.zip" "$name"
            count=$((count + 1))
          done
          cd ..
          if [ "$count" -eq 0 ]; then
            echo "::error::找不到量化 variant 資料夾（預期名稱結尾為 _<N>MB）"
            exit 1
          fi
          ls -lh *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: breeze-asr-coreml-${{ steps.vars.outputs.model_slug }}
          path: '*.zip'
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: breeze-asr-coreml-${{ steps.vars.outputs.model_slug }}-${{ github.run_number }}
          name: Breeze-ASR Core ML ${{ github.event.inputs.model_version }} (WhisperKit)
          files: '*.zip'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-ios:
    name: Compile iOS App
    needs: convert
    if: github.event.inputs.run_ios_test == 'true'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Build web assets and copy to iOS
        run: |
          npm run build
          npx cap copy ios

      - name: Resolve Swift packages
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -resolvePackageDependencies

      - name: Compile (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
