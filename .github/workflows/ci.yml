name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BreezeASR/requirements-ci.txt

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: BreezeASR/frontend/package-lock.json

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r BreezeASR/requirements-ci.txt

      - name: Build frontend
        working-directory: BreezeASR/frontend
        run: |
          npm ci
          npm run build

      - name: Prepare test runtime
        run: |
          model_dir="${RUNNER_TEMP}/breeze-model"
          mkdir -p "${model_dir}"
          printf '%s\n' '{}' > "${model_dir}/config.json"
          {
            echo "BREEZEASR_MODEL_DIR=${model_dir}"
            echo "BREEZEASR_FFMPEG=$(command -v ffmpeg)"
          } >> "${GITHUB_ENV}"

      - name: Reject tracked secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)[^/]*credentials[^/]*\.(json|txt|ya?ml)$|\.pem$|id_rsa$|id_ed25519$'; then
            echo "tracked secret-like files"
            exit 1
          fi
          if git grep -I -n -E "BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY"; then
            echo "tracked private key"
            exit 1
          fi

      - name: Run tests
        working-directory: BreezeASR
        env:
          PYTHONPATH: ${{ github.workspace }}/BreezeASR:${{ github.workspace }}/BreezeASR/tests
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m unittest discover -s tests -v
