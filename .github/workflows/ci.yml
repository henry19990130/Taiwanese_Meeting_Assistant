name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    name: 安全測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只裝 import 測試會碰到的套件。不要裝 requirements.txt：
      # 裡面的語音模型、transformers、faster-whisper、Ollama 都不在這次檢查裡。
      - name: 安裝測試需要的套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.115" \
            "python-multipart>=0.0.9" \
            "python-dotenv>=1.0" \
            "httpx>=0.27" \
            "psycopg[binary]>=3.2" \
            "numpy>=1.24"

      - name: 執行 backend/tests/test_security.py
        run: python -m unittest backend/tests/test_security.py

  frontend:
    name: 前端語法檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 檢查 frontend JavaScript 語法
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(frontend/*.js)
          if (( ${#files[@]} == 0 )); then
            echo "frontend 底下沒有 .js 檔"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "node --check ${file}"
            node --check "${file}"
          done

  database:
    name: 資料庫測試
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meeting
          POSTGRES_PASSWORD: meeting
          POSTGRES_DB: meeting_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meeting -d meeting_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: meeting_assistant
      DB_USER: meeting
      DB_PASSWORD: meeting
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝資料庫測試需要的套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]>=3.2" "python-dotenv>=1.0"

      - name: 套用 database/schema.sql
        run: |
          python << 'PY'
          import psycopg
          from pathlib import Path

          sql = Path("database/schema.sql").read_text(encoding="utf-8")
          with psycopg.connect(
              host="localhost",
              port=5432,
              dbname="meeting_assistant",
              user="meeting",
              password="meeting",
              autocommit=True,
          ) as conn:
              with psycopg.ClientCursor(conn) as cur:
                  cur.execute(sql)
          PY

      - name: 執行 scripts/test_db.py
        run: python scripts/test_db.py
